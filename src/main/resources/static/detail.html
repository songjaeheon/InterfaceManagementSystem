<!DOCTYPE html>
<html>
<head>
    <title>EIMS Notice Detail</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<div id="app" class="container mt-5">
    <div v-if="loading" class="text-center">Loading...</div>
    <div v-else-if="error" class="alert alert-danger">{{ error }}</div>
    <div v-else class="card">
        <div class="card-header d-flex justify-content-between">
            <h3>{{ notice.title }}</h3>
            <span v-if="notice.pinned" class="badge badge-warning">PINNED</span>
        </div>
        <div class="card-body">
            <h6 class="card-subtitle mb-2 text-muted">
                Start: {{ new Date(notice.startDate).toLocaleString() }} -
                End: {{ notice.endDate ? new Date(notice.endDate).toLocaleString() : 'Indefinite' }}
            </h6>
            <p class="card-text" style="white-space: pre-wrap;">{{ notice.content }}</p>

            <div v-if="notice.attachmentPath" class="mt-4">
                <strong>Attachment:</strong> {{ notice.attachmentPath }}
                <!-- In a real app, you'd have a download link here -->
            </div>
        </div>
    </div>
</div>

<script>
    new Vue({
        el: '#app',
        data: {
            notice: {},
            loading: true,
            error: null
        },
        mounted() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (id) {
                this.fetchNotice(id);
            } else {
                this.error = "No notice ID provided";
                this.loading = false;
            }
        },
        methods: {
            fetchNotice(id) {
                axios.get('/api/notices/' + id)
                    .then(response => {
                        this.notice = response.data;
                        this.loading = false;
                    })
                    .catch(e => {
                        this.error = "Notice not found";
                        this.loading = false;
                    });
            }
        }
    });
</script>
</body>
</html>
